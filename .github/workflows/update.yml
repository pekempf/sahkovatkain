name: Update Sahkovatkain forecast

# Shelly sends current KVS settings and triggers this workflow hourly.
# Do not schedule standalone runs: those lack live Shelly settings.
on:
  repository_dispatch:
    types: [shelly_settings]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test hot-water planner
        run: python -m unittest test_hot_water_planner.py
      - name: Calculate forecast
        env:
          SHELLY_EVENT_SETTINGS: ${{ toJSON(github.event.client_payload.settings) }}
        run: python sahkovatkain.py
      - name: Commit result if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/sahkovatkain.txt deploy/sahkovatkain.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Sahkovatkain forecast"
            git push
          fi
