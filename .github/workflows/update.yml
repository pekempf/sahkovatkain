name: Update Sahkovatkain forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose Cloudflare bridge
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          SETTINGS_URL: ${{ vars.SETTINGS_URL }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error
          url = os.environ["SETTINGS_URL"]
          token = os.environ.get("CLOUDFLARE_READ_TOKEN", "")
          root = url.rsplit("/settings", 1)[0] + "/"
          print("Read token configured:", bool(token))
          cases = [
              ("root without token", root, {}),
              ("settings without token", url, {}),
              ("settings with token", url, {"Authorization": "Bearer " + token} if token else {}),
          ]
          for label, target, headers in cases:
              request = urllib.request.Request(target, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print(label, "HTTP", response.status, "content-type", response.headers.get("content-type"))
              except urllib.error.HTTPError as error:
                  print(label, "HTTP", error.code, "content-type", error.headers.get("content-type"),
                        "cf-mitigated", error.headers.get("cf-mitigated", "none"),
                        "cf-ray", error.headers.get("cf-ray", "none"))
              except Exception as error:
                  print(label, "connection error", type(error).__name__)
          PY
      - name: Calculate forecast
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          SETTINGS_URL: ${{ vars.SETTINGS_URL }}
        run: python sahkovatkain.py
      - name: Commit result if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/sahkovatkain.txt deploy/sahkovatkain.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Sahkovatkain forecast"
            git push
          fi
